<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Mensal — Assistentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --border-color: #334155;
        --danger-color: #ef4444;
    }

    body {
        font-family: 'Barlow', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
    }

    h1, h2 {
        font-family: 'Barlow Condensed', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .section {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        border: 1px solid var(--border-color);
    }

    .chart-container {
        position: relative;
        width: 100%;
        height: 320px;
        margin-bottom: 25px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
        background: #0f172a;
        padding: 15px;
        border-radius: 6px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: #94a3b8;
    }

    .form-group input, .form-group select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
        background: #1e293b;
        color: #fff;
    }

    button {
        background-color: var(--accent-color);
        color: #0f172a;
        font-weight: bold;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .btn-clear {
        background-color: transparent;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
        padding: 5px 10px;
        font-size: 0.85rem;
    }

    .btn-clear:hover {
        background-color: var(--danger-color);
        color: #fff;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 0.9rem;
    }

    th, td {
        border: 1px solid var(--border-color);
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #0f172a;
    }
</style>
</head>
<body>

    <h1>Dashboard KPI Mensal — Assistentes</h1>

    <!-- 1. AUDITORIA DE RECEBIMENTO -->
    <div class="section">
        <div class="section-header">
            <h2>Auditoria de Recebimento</h2>
            <button class="btn-clear" onclick="limparDados('recebimento')">Limpar Registros de Recebimento</button>
        </div>
        
        <!-- KPI Gráfico (NO TOPO) -->
        <div class="chart-container">
            <canvas id="chartRecebimento"></canvas>
        </div>

        <!-- Formulário de Preenchimento -->
        <form id="formRecebimento" onsubmit="adicionarDados(event, 'recebimento')">
            <div class="form-grid">
                <div class="form-group">
                    <label>Dia</label>
                    <input type="number" id="rec_dia" min="1" max="31" required>
                </div>
                <div class="form-group">
                    <label>Setor</label>
                    <select id="rec_setor" required>
                        <option value="1C">1C</option>
                        <option value="1T">1T</option>
                        <option value="PWT">PWT</option>
                        <option value="BODY">BODY</option>
                        <option value="1K">1K</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fornecedor</label>
                    <input type="text" id="rec_fornecedor" required>
                </div>
                <div class="form-group">
                    <label>Ran (Controle)</label>
                    <input type="text" id="rec_ran" required>
                </div>
                <div class="form-group">
                    <label>Meta</label>
                    <input type="number" id="rec_meta" required>
                </div>
                <div class="form-group">
                    <label>Auditada</label>
                    <input type="number" id="rec_auditada" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="rec_status" required>
                        <option value="Cumprida">Cumprida</option>
                        <option value="Não Cumprida">Não Cumprida</option>
                    </select>
                </div>
            </div>
            <button type="submit">Registrar Auditoria de Recebimento</button>
        </form>

        <table id="tabelaRecebimento">
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Setor</th>
                    <th>Fornecedor</th>
                    <th>Ran</th>
                    <th>Meta</th>
                    <th>Auditada</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- 2. AUDITORIA DE EMBALAGENS VAZIAS -->
    <div class="section">
        <div class="section-header">
            <h2>Auditoria de Embalagens Vazias</h2>
            <button class="btn-clear" onclick="limparDados('embalagens')">Limpar Registros de Embalagens</button>
        </div>
        
        <!-- KPI Gráfico (NO TOPO) -->
        <div class="chart-container">
            <canvas id="chartEmbalagens"></canvas>
        </div>

        <!-- Formulário de Preenchimento -->
        <form id="formEmbalagens" onsubmit="adicionarDados(event, 'embalagens')">
            <div class="form-grid">
                <div class="form-group">
                    <label>Dia</label>
                    <input type="number" id="emb_dia" min="1" max="31" required>
                </div>
                <div class="form-group">
                    <label>Setor</label>
                    <select id="emb_setor" required>
                        <option value="1C">1C</option>
                        <option value="1T">1T</option>
                        <option value="PWT">PWT</option>
                        <option value="BODY">BODY</option>
                        <option value="1K">1K</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fornecedor</label>
                    <input type="text" id="emb_fornecedor" required>
                </div>
                <div class="form-group">
                    <label>Ran (Controle)</label>
                    <input type="text" id="emb_ran" required>
                </div>
                <div class="form-group">
                    <label>Meta</label>
                    <input type="number" id="emb_meta" required>
                </div>
                <div class="form-group">
                    <label>Auditada</label>
                    <input type="number" id="emb_auditada" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="emb_status" required>
                        <option value="Cumprida">Cumprida</option>
                        <option value="Não Cumprida">Não Cumprida</option>
                    </select>
                </div>
            </div>
            <button type="submit">Registrar Auditoria de Embalagem</button>
        </form>

        <table id="tabelaEmbalagens">
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Setor</th>
                    <th>Fornecedor</th>
                    <th>Ran</th>
                    <th>Meta</th>
                    <th>Auditada</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const setores = ['1C', '1T', 'PWT', 'BODY', '1K'];
        
        // Estruturas de dados salvas localmente
        let registros = {
            recebimento: JSON.parse(localStorage.getItem('kpi_recebimento')) || [],
            embalagens: JSON.parse(localStorage.getItem('kpi_embalagens')) || []
        };

        function criarGrafico(idCanvas, titulo) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            return new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: setores,
                    datasets: [{
                        label: 'Total Auditado (Status: Cumprida)',
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: '#38bdf8',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } },
                        title: { display: true, text: titulo, color: '#f8fafc' }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        const chartRec = criarGrafico('chartRecebimento', 'KPI Auditoria de Recebimento por Setor');
        const chartEmb = criarGrafico('chartEmbalagens', 'KPI Auditoria de Embalagens Vazias por Setor');

        // Função para atualizar tabela e gráfico a partir da memória/localStorage
        function atualizarInterface(tipo) {
            const lista = registros[tipo];
            const tabelaBody = document.querySelector(`#tabela${tipo === 'recebimento' ? 'Recebimento' : 'Embalagens'} tbody`);
            tabelaBody.innerHTML = '';

            const totaisPorSetor = { '1C': 0, '1T': 0, 'PWT': 0, 'BODY': 0, '1K': 0 };

            lista.forEach(item => {
                // Preenche Tabela
                const novaLinha = tabelaBody.insertRow();
                novaLinha.innerHTML = `
                    <td>${item.dia}</td>
                    <td>${item.setor}</td>
                    <td>${item.fornecedor}</td>
                    <td>${item.ran}</td>
                    <td>${item.meta}</td>
                    <td>${item.auditada}</td>
                    <td style="color: ${item.status === 'Cumprida' ? '#4ade80' : '#f87171'}">${item.status}</td>
                `;

                // Soma total para o gráfico (apenas se for "Cumprida")
                if (item.status === 'Cumprida') {
                    totaisPorSetor[item.setor] += item.auditada;
                }
            });

            // Atualiza o Gráfico
            const chart = tipo === 'recebimento' ? chartRec : chartEmb;
            chart.data.datasets[0].data = setores.map(s => totaisPorSetor[s]);
            chart.update();
        }

        function adicionarDados(e, tipo) {
            e.preventDefault();
            const prefixo = tipo === 'recebimento' ? 'rec_' : 'emb_';
            
            const novoItem = {
                dia: document.getElementById(prefixo + 'dia').value,
                setor: document.getElementById(prefixo + 'setor').value,
                fornecedor: document.getElementById(prefixo + 'fornecedor').value,
                ran: document.getElementById(prefixo + 'ran').value,
                meta: document.getElementById(prefixo + 'meta').value,
                auditada: parseFloat(document.getElementById(prefixo + 'auditada').value),
                status: document.getElementById(prefixo + 'status').value
            };

            // Adiciona na memória local e no localStorage
            registros[tipo].push(novoItem);
            localStorage.setItem(`kpi_${tipo}`, JSON.stringify(registros[tipo]));

            // Atualiza a tela
            atualizarInterface(tipo);

            // Reseta o formulário
            document.getElementById(`form${tipo === 'recebimento' ? 'Recebimento' : 'Embalagens'}`).reset();
        }

        function limparDados(tipo) {
            if (confirm(`Tem certeza que deseja apagar todos os registros de ${tipo}?`)) {
                registros[tipo] = [];
                localStorage.removeItem(`kpi_${tipo}`);
                atualizarInterface(tipo);
            }
        }

        // Carrega dados salvos assim que a página é aberta
        document.addEventListener('DOMContentLoaded', () => {
            atualizarInterface('recebimento');
            atualizarInterface('embalagens');
        });
    </script>
</body>
</html>
